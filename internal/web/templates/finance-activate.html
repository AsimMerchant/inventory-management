<h1>Activate my account</h1>{{if .Error}}<div class="banner bad">{{.Error}}</div>{{end}}<form method="post" class="auth-form"><input type="hidden" name="csrf" value="{{.CSRF}}"><fieldset class="auth-section"><legend>Activate your account</legend><div class="field"><label class="lab" for="activate-mobile">Mobile number</label><input class="inp" id="activate-mobile" name="mobile" value="{{.Mobile}}"></div><div class="field"><label class="lab" for="activate-code">One-time setup code</label><input class="inp" id="activate-code" name="code"></div><div class="field"><label class="lab" for="activate-password">Create password</label><input class="inp" id="activate-password" type="password" name="password" autocomplete="new-password"></div><div class="field"><label class="lab" for="activate-again">Type password again</label><input class="inp" id="activate-again" type="password" name="again" autocomplete="new-password"></div><button class="btn" type="submit">Activate my account</button></fieldset></form>
