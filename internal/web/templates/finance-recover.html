<h1>Recover authorized access</h1>{{if .Error}}<div class="banner bad">{{.Error}}</div>{{end}}<form method="post" class="auth-form"><input type="hidden" name="csrf" value="{{.CSRF}}"><fieldset class="auth-section"><legend>Recover authorized access</legend><div class="field"><label class="lab" for="recover-key">Recovery key</label><input class="inp" id="recover-key" name="recovery"></div><div class="field"><label class="lab" for="recover-mobile">Administrator mobile number</label><input class="inp" id="recover-mobile" name="mobile" value="{{.Mobile}}"></div><div class="field"><label class="lab" for="recover-password">New password</label><input class="inp" id="recover-password" type="password" name="password" autocomplete="new-password"></div><div class="field"><label class="lab" for="recover-again">Type new password again</label><input class="inp" id="recover-again" type="password" name="again" autocomplete="new-password"></div><button class="btn" type="submit">Recover access</button></fieldset></form>
