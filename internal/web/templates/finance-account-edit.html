<h1>Edit authorized person</h1>{{if .Error}}<div class="banner bad">{{.Error}}</div>{{end}}<form method="post"><input type="hidden" name="csrf" value="{{.CSRF}}"><label>Name <input name="name" value="{{.Account.DisplayName}}"></label><label>Mobile number <input name="mobile" value="{{.Account.Mobile}}"></label><label>Role <select name="role"><option value="user" {{if eq .Account.Role "user"}}selected{{end}}>Financial user</option><option value="admin" {{if eq .Account.Role "admin"}}selected{{end}}>Financial administrator</option></select></label><button>Save authorized person</button></form>
