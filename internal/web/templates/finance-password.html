<h1>Change password</h1>{{if .Error}}<div class="banner bad">{{.Error}}</div>{{end}}<form method="post" class="auth-form"><input type="hidden" name="csrf" value="{{.CSRF}}"><fieldset class="auth-section"><legend>Change your password</legend><div class="field"><label class="lab" for="current-password">Current password</label><input class="inp" id="current-password" type="password" name="current" autocomplete="current-password"></div><div class="field"><label class="lab" for="new-password">New password</label><input class="inp" id="new-password" type="password" name="password" autocomplete="new-password"></div><div class="field"><label class="lab" for="new-password-again">Type new password again</label><input class="inp" id="new-password-again" type="password" name="again" autocomplete="new-password"></div><button class="btn" type="submit">Change password</button></fieldset></form>
