<h1>Authorized people</h1>{{if .Error}}<div class="banner bad">{{.Error}}</div>{{end}}{{if .Code}}<h2>Setup code</h2><pre>{{.Code}}</pre>{{end}}<ul>{{range .Accounts}}<li>{{.DisplayName}} · {{.Mobile}} · {{.Role}} · {{.Status}} <a href="/finance/accounts/{{.ID}}/edit">Edit</a><form method="post" action="/finance/accounts/{{.ID}}/reset" style="display:inline"><input type="hidden" name="csrf" value="{{$.CSRF}}"><button>Reset</button></form><form method="post" action="/finance/accounts/{{.ID}}/disable" style="display:inline"><input type="hidden" name="csrf" value="{{$.CSRF}}"><button>Disable</button></form></li>{{end}}</ul><h2>Add authorized person</h2><form method="post" action="/finance/accounts/new"><input type="hidden" name="csrf" value="{{.CSRF}}"><label>Name <input name="name"></label><label>Mobile number <input name="mobile"></label><label>Role <select name="role"><option value="user">Financial user</option><option value="admin">Financial administrator</option></select></label><button>Add</button></form>
